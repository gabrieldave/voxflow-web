server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

  # Hashed build assets: cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Notarized installer
  location /downloads/ {
    types { application/x-apple-diskimage dmg; }
    add_header Content-Disposition "attachment";
    try_files $uri =404;
  }

  location = /es { return 301 /es/; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri/index.html =404;
  }
}
