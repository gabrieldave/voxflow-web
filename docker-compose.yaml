# Coolify build pack: dockercompose · voxflow.iareal.net → 127.0.0.1:3049
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: https://voxflow.iareal.net
    ports:
      - "127.0.0.1:3049:8080"
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /dev/shm:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    volumes:
      - voxflow_storage:/app/storage

volumes:
  voxflow_storage:
    driver: local

networks:
  coolify:
    external: true
    name: coolify
