# Coolify build pack: dockercompose · voxflow.iareal.net → 127.0.0.1:3049
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: https://voxflow.iareal.net
    ports:
      - "127.0.0.1:3049:80"
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  coolify:
    external: true
    name: coolify
